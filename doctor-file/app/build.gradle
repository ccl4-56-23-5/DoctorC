plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wirelessalien.zipxtract'
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    ndkVersion = '28.2.13676358'

    externalNativeBuild {
        cmake {
            path 'src/native/c/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.setSrcDirs(['src/native/java'])
            kotlin.setSrcDirs(['src/native/java'])
            res.setSrcDirs(['src/native/res'])
            assets.setSrcDirs(['src/main/assets'])
            manifest.srcFile 'src/native/AndroidManifest.xml'
        }
        foss { java.setSrcDirs([]); kotlin.setSrcDirs([]); res.setSrcDirs([]) }
        ps { java.setSrcDirs([]); kotlin.setSrcDirs([]); res.setSrcDirs([]) }
        debug { res.setSrcDirs([]) }
        androidTest {
            java.setSrcDirs(['src/nativeAndroidTest/java'])
            kotlin.setSrcDirs(['src/nativeAndroidTest/java'])
            assets.setSrcDirs(['src/nativeAndroidTest/assets'])
        }
    }
    flavorDimensions "version"
    productFlavors {
        foss {
            dimension "version"
            applicationId "local.sevenzip.android"
        }
        ps {
            dimension "version"
            applicationId "local.sevenzip.android.ps"
            versionNameSuffix "-ps"
        }
    }

    defaultConfig {
        applicationId "local.sevenzip.android"
        minSdk 24
        targetSdk 35
        versionCode 31
        versionName "1.1.5+30"
        resourceConfigurations += ['en', 'zh-rCN']

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable = false
        }
        debug {
            debuggable = true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    dependenciesInfo {
        includeInApk false
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/**',
                    '**.txt'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                    'lib7-Zip-JBinding.so',
                    'libarchive-jni.so',
                    'libzstd-jni-1.5.7-2.so'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.window:window:1.5.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.Dimezis:BlurView:version-4.0.0'

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.activity:activity:1.10.1'

    //glide
    implementation("com.github.bumptech.glide:glide:5.0.5")

    //Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    //fragment

    //apache commons compress
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'

    //zip4j
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    //7-Zip-Jbinding-4Android
    implementation 'com.github.omicronapps:7-Zip-JBinding-4Android:Release-16.02-2.03'

    //libarchive
    implementation 'me.zhanghai.android.libarchive:library:1.1.6'

    implementation "com.github.luben:zstd-jni:1.5.7-6@aar"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //shimmer
}
