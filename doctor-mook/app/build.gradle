plugins {
    id 'com.android.application' version '9.2.1'
}
if (providers.gradleProperty('bookBuildRoot').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('bookBuildRoot').get()))
}

android {
    namespace 'local.bookdoctorc'
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    defaultConfig {
        applicationId 'local.bookdoctorc'
        minSdk 26
        targetSdk 37
        versionCode 33
        versionName '1.0.24+33'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.16.0'
    constraints {
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    }
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    testImplementation 'junit:junit:4.13.2'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
